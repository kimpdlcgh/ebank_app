name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/ebank_app/package-lock.json

      - name: Install app dependencies
        working-directory: backend/ebank_app
        run: npm ci

      - name: Build app
        working-directory: backend/ebank_app
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting (marketing + app)
        run: npx firebase-tools deploy --only hosting:marketing,hosting:app --project e-bank-dashboard --non-interactive
