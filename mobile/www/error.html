<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Safeguard Securities — Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(155deg, #f8fbff 0%, #eff4ff 48%, #f5f8ff 100%);
      color: #162746;
    }
    .card {
      text-align: center;
      max-width: 360px;
    }
    .glyph {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.25rem;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: #214c87;
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
    }
    h1 { font-size: 1.25rem; font-weight: 700; margin: 0 0 0.5rem; }
    p { margin: 0 0 1.5rem; font-size: 0.95rem; color: #5e6b85; line-height: 1.5; }
    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 0.8rem 1.6rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: #214c87;
      cursor: pointer;
    }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <div class="card">
    <div class="glyph" aria-hidden="true">S</div>
    <h1>You're offline</h1>
    <p>We couldn't reach Safeguard Securities. Check your internet connection and try again.</p>
    <button type="button" onclick="retry()">Try again</button>
  </div>
  <script>
    function retry() {
      window.location.href = 'https://safeguardsecurities.us';
    }
  </script>
</body>
</html>
