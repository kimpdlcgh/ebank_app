
<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    window.location.replace("index.html");
  </script>
  <title>Login - Safeguard Securities</title>
  <link rel="stylesheet" href="wp-content/themes/hello-elementor/style.min-ver=2.5.0.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <style>
    :root {
      --brand-900: #0c2950;
      --brand-700: #1f4f93;
      --brand-200: #d7e4f7;
      --text: #1a2130;
      --muted: #5d667a;
      --surface: #ffffff;
      --danger: #b3261e;
      --success: #166534;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 18%, #eaf1ff 0%, #eaf1ff 20%, transparent 22%),
        radial-gradient(circle at 88% 80%, #dce8fb 0%, #dce8fb 18%, transparent 20%),
        linear-gradient(145deg, #f7f9fd, #eef3fb 55%, #f4f6fa);
      padding: 20px;
    }

    .login-container {
      background: var(--surface);
      border: 1px solid #e8edf6;
      border-radius: 16px;
      padding: 32px;
      max-width: 430px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(12, 41, 80, 0.12);
      text-align: left;
    }

    .logo-wrap {
      text-align: center;
    }

    .login-container img.logo {
      width: 190px;
      max-width: 100%;
      margin-bottom: 12px;
    }

    .login-title {
      margin: 4px 0 6px;
      font-size: 1.55rem;
      line-height: 1.2;
      color: var(--brand-900);
      text-align: center;
    }

    .login-subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
    }

    .field {
      margin: 0 0 14px;
    }

    .field label {
      display: block;
      margin: 0 0 6px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #2d3750;
    }

    .login-container input[type="text"],
    .login-container input[type="password"] {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #cfd8e8;
      border-radius: 10px;
      background: #fbfdff;
      color: var(--text);
      font-size: 0.95rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .login-container input:focus {
      border-color: var(--brand-700);
      box-shadow: 0 0 0 3px rgba(31, 79, 147, 0.15);
      outline: none;
    }

    .password-wrap {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--brand-700);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 6px;
    }

    .toggle-password:hover {
      background: #edf3ff;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 4px 0 14px;
      flex-wrap: wrap;
    }

    .remember-wrap {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.88rem;
      color: #2f3a53;
      cursor: pointer;
    }

    .remember-wrap input {
      margin: 0;
    }

    .text-link {
      color: var(--brand-700);
      font-size: 0.88rem;
      text-decoration: none;
      font-weight: 600;
    }

    .text-link:hover {
      text-decoration: underline;
    }

    .login-container button[type="submit"] {
      width: 100%;
      padding: 12px;
      background: linear-gradient(120deg, var(--brand-900), var(--brand-700));
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.98rem;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .login-container button[type="submit"]:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(12, 41, 80, 0.24);
    }

    .login-container button[type="submit"]:disabled {
      cursor: not-allowed;
      opacity: 0.7;
      transform: none;
      box-shadow: none;
    }

    .status-message {
      margin-top: 12px;
      font-size: 0.9rem;
      min-height: 20px;
      text-align: center;
    }

    .status-message.error {
      color: var(--danger);
    }

    .status-message.success {
      color: var(--success);
    }

    .caps-warning {
      margin-top: 6px;
      color: #9a3412;
      font-size: 0.8rem;
      display: none;
    }

    .link {
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
    }

    .link a {
      color: var(--brand-700);
      text-decoration: none;
      font-weight: 600;
    }

    .link a:hover {
      text-decoration: underline;
    }

    .firebase-status {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.82rem;
      line-height: 1.4;
      background: #eef3fb;
      color: #1f4f93;
      border: 1px solid #d5e1f5;
    }

    .firebase-status.ok {
      background: #eaf7ef;
      border-color: #c5e8d2;
      color: #166534;
    }

    .firebase-status.warn {
      background: #fff4e8;
      border-color: #ffd8b2;
      color: #9a3412;
    }

    @media (max-width: 520px) {
      .login-container {
        padding: 24px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-wrap">
      <img src="wp-content/uploads/sites/12/2022/02/logo2.png" alt="Safeguard Securities Logo" class="logo" />
    </div>
    <h1 class="login-title">Welcome Back</h1>
    <p class="login-subtitle">Sign in with your username or email to access your dashboard.</p>
    <form id="login-form">
      <div class="field">
        <label for="username">Username or Email</label>
        <input type="text" id="username" placeholder="Enter your username or email" autocomplete="username" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required />
          <button type="button" class="toggle-password" id="toggle-password" aria-label="Show password">Show</button>
        </div>
        <div class="caps-warning" id="caps-warning">Caps Lock appears to be on.</div>
      </div>

      <div class="row">
        <label class="remember-wrap" for="remember-username">
          <input type="checkbox" id="remember-username" />
          Remember username
        </label>
        <a class="text-link" href="register.html">Need account?</a>
      </div>

      <button type="submit" id="submit-btn">Login</button>
      <div class="status-message" id="status-message" aria-live="polite"></div>
    </form>
    <div class="link">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
    <div class="firebase-status" id="firebase-status">Checking Firebase setup...</div>
  </div>

  <script>
    const auth = window.firebaseAuth;
    const db = window.firebaseDb;

    const form = document.getElementById('login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const rememberInput = document.getElementById('remember-username');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const submitBtn = document.getElementById('submit-btn');
    const statusMessage = document.getElementById('status-message');
    const capsWarning = document.getElementById('caps-warning');
    const firebaseStatus = document.getElementById('firebase-status');

    const rememberedUsername = localStorage.getItem('sgsRememberedUsername');
    if (rememberedUsername) {
      usernameInput.value = rememberedUsername;
      rememberInput.checked = true;
    }

    function setStatus(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = 'status-message ' + (type || '');
    }

    function withTimeout(promise, ms) {
      return Promise.race([
        promise,
        new Promise(function (_, reject) {
          setTimeout(function () { reject(new Error('timeout')); }, ms);
        })
      ]);
    }

    function saveLocalUserMap(usernameKey, emailValue) {
      if (!usernameKey || !emailValue) return;
      try {
        const mapRaw = localStorage.getItem('sgsLocalUserMap');
        const map = mapRaw ? JSON.parse(mapRaw) : {};
        map[String(usernameKey).toLowerCase()] = String(emailValue).toLowerCase();
        localStorage.setItem('sgsLocalUserMap', JSON.stringify(map));
      } catch (err) {
        // Ignore local storage parse/write issues.
      }
    }

    function getLocalProfileByEmail(emailValue) {
      if (!emailValue) return null;
      try {
        const raw = localStorage.getItem('sgsLocalProfiles');
        if (!raw) return null;
        const profiles = JSON.parse(raw);
        return profiles[String(emailValue).toLowerCase()] || null;
      } catch (err) {
        return null;
      }
    }

    function buildCandidateEmailsFromUsername(rawUsername) {
      const username = String(rawUsername || '').trim().toLowerCase();
      if (!username || username.indexOf('@') > -1) return [];

      const domains = [];
      const seen = {};

      function pushDomain(domain) {
        if (!domain) return;
        const d = String(domain).toLowerCase();
        if (!seen[d]) {
          seen[d] = true;
          domains.push(d);
        }
      }

      const lastEmail = localStorage.getItem('sgsLastLoginEmail');
      if (lastEmail && lastEmail.indexOf('@') > -1) {
        pushDomain(lastEmail.split('@')[1]);
      }

      const lastRegisteredEmail = localStorage.getItem('sgsLastRegisteredEmail');
      if (lastRegisteredEmail && lastRegisteredEmail.indexOf('@') > -1) {
        pushDomain(lastRegisteredEmail.split('@')[1]);
      }

      pushDomain('gmail.com');
      pushDomain('yahoo.com');
      pushDomain('outlook.com');

      return domains.map(function(domain) {
        return username + '@' + domain;
      });
    }

    function showFirebaseStatus() {
      const appReady = !!(window.firebase && window.firebase.apps && window.firebase.apps.length);
      const authReady = !!auth;
      const dbReady = !!db;
      const analyticsReady = !!window.firebaseAnalytics;

      const text = [
        'Firebase status',
        (appReady ? 'App: OK' : 'App: Missing'),
        (authReady ? 'Auth: OK' : 'Auth: Missing'),
        (dbReady ? 'Firestore: OK' : 'Firestore: Missing'),
        (analyticsReady ? 'Analytics: OK' : 'Analytics: Not active')
      ].join(' | ');

      firebaseStatus.textContent = text;
      firebaseStatus.classList.remove('ok', 'warn');

      if (appReady && authReady && dbReady) {
        firebaseStatus.classList.add('ok');
      } else {
        firebaseStatus.classList.add('warn');
      }
    }

    showFirebaseStatus();

    togglePasswordBtn.addEventListener('click', function () {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePasswordBtn.textContent = isPassword ? 'Hide' : 'Show';
      togglePasswordBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    });

    passwordInput.addEventListener('keyup', function (event) {
      const capsOn = event.getModifierState && event.getModifierState('CapsLock');
      capsWarning.style.display = capsOn ? 'block' : 'none';
    });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      setStatus('', '');

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        setStatus('Please enter both username and password.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        let signInEmail = '';
        let signInCandidates = [];

        // If user typed an email, bypass Firestore lookup.
        if (username.indexOf('@') > -1) {
          signInEmail = username;
        } else {
          // Try Firestore lookup with timeout so UI never hangs.
          try {
            const lookup = await withTimeout(
              db
                .collection('profiles')
                .where('username_lower', '==', username.toLowerCase())
                .limit(1)
                .get(),
              8000
            );

            if (!lookup.empty) {
              const profile = lookup.docs[0].data();
              signInEmail = profile && profile.email ? profile.email : '';
            }
          } catch (lookupError) {
            // Firestore may be blocked by extension/privacy settings.
          }

          // Local fallback from successful registration in same browser.
          if (!signInEmail) {
            const localMapRaw = localStorage.getItem('sgsLocalUserMap');
            if (localMapRaw) {
              try {
                const localMap = JSON.parse(localMapRaw);
                signInEmail = localMap[username.toLowerCase()] || '';
              } catch (parseErr) {
                signInEmail = '';
              }
            }
          }

          // Extra fallback: if this username matches the local-part of the last successful email login.
          if (!signInEmail) {
            const lastEmail = localStorage.getItem('sgsLastLoginEmail');
            if (lastEmail && lastEmail.indexOf('@') > -1) {
              const emailLocalPart = lastEmail.split('@')[0].toLowerCase();
              if (emailLocalPart === username.toLowerCase()) {
                signInEmail = lastEmail;
              }
            }
          }

          if (!signInEmail) {
            setStatus('Username lookup unavailable. Please sign in using your email address.', 'error');
            signInCandidates = buildCandidateEmailsFromUsername(username);

            if (!signInCandidates.length) {
              return;
            }
          }
        }

        let finalEmail = signInEmail;
        let authResult = null;
        let signInSuccess = false;

        if (finalEmail) {
          try {
            authResult = await auth.signInWithEmailAndPassword(finalEmail, password);
            signInSuccess = true;
          } catch (signInError) {
            setStatus('Login failed. Please verify your credentials.', 'error');
            return;
          }
        } else {
          for (let i = 0; i < signInCandidates.length; i += 1) {
            const candidate = signInCandidates[i];
            try {
              authResult = await auth.signInWithEmailAndPassword(candidate, password);
              finalEmail = candidate;
              signInSuccess = true;
              break;
            } catch (candidateErr) {
              // Try next candidate.
            }
          }

          if (!signInSuccess) {
            setStatus('Username login unavailable. Please use your full email address.', 'error');
            return;
          }
        }

        // Persist local fallbacks for username sign-in when Firestore is unavailable.
        localStorage.setItem('sgsLastLoginEmail', finalEmail.toLowerCase());
        if (username.indexOf('@') > -1) {
          const inferredUsername = username.split('@')[0];
          saveLocalUserMap(inferredUsername, finalEmail);
        } else {
          saveLocalUserMap(username, finalEmail);
        }

        try {
          const localProfile = getLocalProfileByEmail(finalEmail) || {};
          const fallbackUsername = username.indexOf('@') > -1 ? username.split('@')[0] : username;
          const currentProfile = {
            id: authResult && authResult.user ? authResult.user.uid : '',
            username: localProfile.username || fallbackUsername,
            email: finalEmail,
            first_name: localProfile.first_name || '',
            middle_name: localProfile.middle_name || '',
            last_name: localProfile.last_name || '',
            mobile: localProfile.mobile || '',
            address: localProfile.address || ''
          };
          localStorage.setItem('sgsCurrentProfile', JSON.stringify(currentProfile));
        } catch (cacheErr) {
          // Ignore local cache failures.
        }

        if (rememberInput.checked) {
          localStorage.setItem('sgsRememberedUsername', username);
        } else {
          localStorage.removeItem('sgsRememberedUsername');
        }

        setStatus('Login successful. Redirecting...', 'success');
        window.location.href = 'backend/ebank_app/dist/#/dashboard';
      } catch (err) {
        setStatus('Something went wrong. Please try again.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
