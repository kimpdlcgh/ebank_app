
<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    window.location.replace("index.html");
  </script>
  <title>Register - Safeguard Securities</title>
  <link rel="stylesheet" href="wp-content/themes/hello-elementor/style.min-ver=2.5.0.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f5f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .register-container {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 500px;
      width: 95%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    .register-container img.logo {
      width: 190px;
      max-width: 100%;
      margin-bottom: 12px;
    }
    .register-container h2 {
      margin-bottom: 24px;
      font-size: 24px;
      color: #003366;
    }
    .register-container input, .register-container textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .register-container button {
      width: 100%;
      padding: 12px;
      background-color: #003366;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    .register-container button:hover {
      background-color: #00509e;
    }
    .register-container .link {
      text-align: center;
      margin-top: 12px;
    }
    .register-container .link a {
      color: #003366;
      text-decoration: none;
    }
    .error-message {
      color: red;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <img src="wp-content/uploads/sites/12/2022/02/logo2.png" alt="Safeguard Securities Logo" class="logo" />
    <h2>Create an Account</h2>
    <form id="register-form">
      <input type="text" id="username" placeholder="Username" required />
      <input type="text" id="first_name" placeholder="First Name" required />
      <input type="text" id="middle_name" placeholder="Middle Name" />
      <input type="text" id="last_name" placeholder="Last Name" required />
      <input type="email" id="email" placeholder="Email address" required />
      <input type="tel" id="mobile" placeholder="Mobile Number (e.g., +639171234567)" required />
      <textarea id="address" placeholder="Complete Address" rows="3" required></textarea>
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Register</button>
      <div class="error-message" id="error-message"></div>
    </form>
    <div class="link">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

  <script>
    const auth = window.firebaseAuth;
    const db = window.firebaseDb;

    document.getElementById("register-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const first_name = document.getElementById("first_name").value.trim();
      const middle_name = document.getElementById("middle_name").value.trim();
      const last_name = document.getElementById("last_name").value.trim();
      const email = document.getElementById("email").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const address = document.getElementById("address").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorBox = document.getElementById("error-message");

      try {
        const created = await auth.createUserWithEmailAndPassword(email, password);
        const userId = created.user && created.user.uid;

        if (!userId) {
          errorBox.textContent = "Account created but no user ID was returned.";
          return;
        }

        await db.collection("profiles").doc(userId).set({
          id: userId,
          username: username,
          username_lower: username.toLowerCase(),
          email: email,
          first_name: first_name,
          middle_name: middle_name,
          last_name: last_name,
          mobile: mobile,
          address: address,
          created_at: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (error) {
        errorBox.textContent = error.message || "Registration failed.";
        return;
      }

      window.location.href = "backend/ebank_app/dist/#/dashboard";
    });
  </script>
</body>
</html>
