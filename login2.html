
<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Safeguard Securities</title>
  <link rel="stylesheet" href="wp-content/themes/hello-elementor/style.min-ver=2.5.0.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f5f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    .login-container img.logo {
      width: 190px;
      max-width: 100%;
      margin-bottom: 12px;
    }
    .login-container h2 {
      margin-bottom: 24px;
      font-size: 24px;
      color: #003366;
    }
    .login-container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .login-container button {
      width: 100%;
      padding: 12px;
      background-color: #003366;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    .login-container button:hover {
      background-color: #00509e;
    }
    .login-container .link {
      text-align: center;
      margin-top: 12px;
    }
    .login-container .link a {
      color: #003366;
      text-decoration: none;
    }
    .error-message {
      color: red;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
    }
  </style>
<link rel="icon" href="/assets/favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon/favicon-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
<meta name="msapplication-TileImage" content="/assets/favicon/favicon-192x192.png">
</head>
<body>
  <div class="login-container">
    <img src="wp-content/uploads/sites/12/2022/02/logo2.png" alt="Safeguard Securities Logo" class="logo" />
    <h2>Login to Your Account</h2>
    <form id="login-form">
      <input type="email" id="email" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
      <div class="error-message" id="error-message"></div>
    </form>
    <div class="link">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
  </div>

  <script>
    const auth = window.firebaseAuth;

    document.getElementById("login-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorBox = document.getElementById("error-message");

      try {
        await auth.signInWithEmailAndPassword(email, password);
        window.location.replace("/dashboard");
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });
  </script>
</body>
</html>
